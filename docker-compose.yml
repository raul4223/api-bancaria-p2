name: api-banco-p2-isolated

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: bank_api
      MYSQL_USER: bank_user
      MYSQL_PASSWORD: bank_password
    ports:
      - '3307:3306'
    volumes:
      - bank_mysql_data:/var/lib/mysql
      - ./docker/mysql/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ubank_user', '-pbank_password']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bank_mysql_data:
